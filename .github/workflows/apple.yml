# Apple builds: wraps a release's game (the web build inside its Android APK, so every device plays the same game) as a
# Mac app and an iPhone/iPad app on GitHub's macOS machines, checks both open, and, when asked, attaches them to that
# release. Run it from the Actions tab: "Apple builds" -> "Run workflow", with the release tag (e.g. v128).
# No Apple developer account is used: the Mac app is signed ad hoc (Gatekeeper asks once, see the README) and the iPhone
# app is unsigned, for sideloading with a free Apple ID (AltStore or Sideloadly), which signs it for that phone.
name: Apple builds

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to wrap (e.g. v128)
        required: true
      attach:
        description: Attach the Mac and iPhone builds to that release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apple-${{ inputs.tag }}

env:
  TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  web:
    name: The game, from the release's APK
    runs-on: ubuntu-latest
    steps:
      - name: Download the APK and check its checksum
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+$ ]] || { echo "The tag must look like v128"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "IsekaiVillage-$TAG.apk"
          want=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | grep -oiE "^[0-9a-f]{64}  IsekaiVillage-$TAG\.apk" | cut -c1-64 | tr 'A-F' 'a-f' || true)
          have=$(sha256sum "IsekaiVillage-$TAG.apk" | cut -c1-64)
          [ -n "$want" ] && [ "$want" = "$have" ] || { echo "The APK doesn't match the release notes' checksum ($have vs ${want:-none})"; exit 1; }
      - name: Take the game out
        run: |
          set -euo pipefail
          unzip -q "IsekaiVillage-$TAG.apk" 'assets/public/*' -d apk
          mv apk/assets/public www
          # The Android helper (back button, share sheet, Android updater) isn't for Apple devices.
          rm -f www/android.js
          sed -i 's#[[:space:]]*<script src="./android.js"></script>##' www/index.html
          if grep -q 'android.js' www/index.html; then echo "android.js is still referenced"; exit 1; fi
          test -f www/index.html
          du -sh www
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: www
          retention-days: 3

  mac:
    name: Mac app
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apple/mac/game
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Icon
        run: |
          set -euo pipefail
          python3 -m venv /tmp/py && /tmp/py/bin/pip -q install pillow
          mkdir -p apple/mac/build
          /tmp/py/bin/python apple/tools/icons.py apple/icon.png mac apple/mac/build/icon.png
      - name: Build the app (one app for Apple silicon and Intel Macs)
        working-directory: apple/mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          N=${TAG#v}
          npm pkg set version="1.$((N - 123)).0"
          npm install --no-audit --no-fund
          npx electron-builder --mac dir --universal --publish never
          APP=$(find release -maxdepth 2 -name '*.app' -type d | head -1)
          echo "Built: $APP"
          # Signed ad hoc (no developer account): Apple silicon needs a signature to run at all.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Isekai Village"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "IsekaiVillage-$TAG-mac.zip"
          ls -lh "IsekaiVillage-$TAG-mac.zip"
      - name: Check it opens (a picture of the first minute)
        working-directory: apple/mac
        run: |
          APP=$(find release -maxdepth 2 -name '*.app' -type d | head -1)
          # (The app takes the picture itself after 40 seconds and quits; ISEKAI_TEST keeps its save in a temp folder.)
          ISEKAI_TEST=1 ISEKAI_SHOT="$PWD/mac-shot.png" "$APP/Contents/MacOS/Isekai Village" > app.log 2>&1 &
          for i in $(seq 1 90); do [ -f mac-shot.png ] && break; sleep 1; done
          sleep 2; pkill -f 'Isekai Village.app' || true
          ls -l mac-shot.png || echo "no picture"
          tail -n 40 app.log || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: apple/mac/IsekaiVillage-*-mac.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: mac-shot
          path: apple/mac/mac-shot.png
          retention-days: 7
          if-no-files-found: ignore

  ios:
    name: iPhone and iPad app
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: apple/ios/www
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The app around the game
        working-directory: apple/ios
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run shim
          # The iPhone helper loads before the game, as android.js does on Android.
          perl -0pi -e 's#(<meta name="viewport"[^>]*>)#$1\n    <script src="./ios.js"></script>#' www/index.html
          grep -q 'ios.js' www/index.html
          npx cap add ios
          npx cap sync ios
          ls ios/App
      - name: Safe area, icon, launch screen and name
        working-directory: apple/ios
        run: |
          set -euo pipefail
          python3 -m venv /tmp/py && /tmp/py/bin/pip -q install pillow
          APPDIR=ios/App/App PL=ios/App/App/Info.plist
          # The game's own first screen: its web view inside the safe area (native/GameViewController.swift). It joins
          # AppDelegate.swift, which already imports UIKit and Capacitor and is part of the Xcode project.
          sed '/^import /d' native/GameViewController.swift >> "$APPDIR/AppDelegate.swift"
          sed -i '' 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="GameViewController" customModule="App" customModuleProvider="target"/' "$APPDIR/Base.lproj/Main.storyboard"
          grep -q 'GameViewController' "$APPDIR/Base.lproj/Main.storyboard"
          set_plist() { /usr/libexec/PlistBuddy -c "Set :$1 $3" "$PL" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$PL"; }
          set_plist CFBundleDisplayName string 'Isekai Village'
          set_plist UIStatusBarHidden bool true
          set_plist UIRequiresFullScreen bool true
          set_plist ITSAppUsesNonExemptEncryption bool false
          # Icons: every image the icon set lists, from the one 1024 px picture.
          /tmp/py/bin/python ../tools/icons.py ../icon.png ios /tmp/icon-1024.png
          for f in "$APPDIR"/Assets.xcassets/AppIcon.appiconset/*.png; do
            px=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            cp /tmp/icon-1024.png "$f"; [ "$px" = 1024 ] || sips -z "$px" "$px" "$f" > /dev/null
          done
          # The launch screen: the game's dark colour with the portrait, instead of a blank white one.
          /tmp/py/bin/python ../tools/icons.py ../icon.png splash /tmp/splash.png
          for f in "$APPDIR"/Assets.xcassets/Splash.imageset/*.png; do cp /tmp/splash.png "$f"; done
          /usr/libexec/PlistBuddy -c Print "$PL" | head -60
      - name: Build for iPhone and iPad (unsigned)
        working-directory: apple/ios/ios/App
        run: |
          set -euo pipefail
          N=${TAG#v}
          if [ -d App.xcworkspace ]; then SRC=(-workspace App.xcworkspace); else SRC=(-project App.xcodeproj); fi
          xcodebuild "${SRC[@]}" -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="1.$((N - 123)).0" CURRENT_PROJECT_VERSION="$N" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 25
          rm -rf Payload && mkdir Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "IsekaiVillage-$TAG-ios.ipa" Payload
          ls -lh "IsekaiVillage-$TAG-ios.ipa"
      - name: Check it opens (iPhone and iPad simulators)
        working-directory: apple/ios/ios/App
        run: |
          set -uo pipefail
          N=${TAG#v}
          if [ -d App.xcworkspace ]; then SRC=(-workspace App.xcworkspace); else SRC=(-project App.xcodeproj); fi
          xcodebuild "${SRC[@]}" -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            MARKETING_VERSION="1.$((N - 123)).0" CURRENT_PROJECT_VERSION="$N" CODE_SIGNING_ALLOWED=NO build | tail -n 5
          APP=simbuild/Build/Products/Release-iphonesimulator/App.app
          shot() {
            dev=$(xcrun simctl list devices available | grep -E "^ +$1 \(" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
            [ -n "$dev" ] || { echo "no $1 simulator"; xcrun simctl list devices available | head -40; return 0; }
            xcrun simctl boot "$dev"; xcrun simctl bootstatus "$dev" -b > /dev/null
            xcrun simctl install "$dev" "$APP" && xcrun simctl launch "$dev" io.voyage.labs.isekaivillage
            sleep 50
            xcrun simctl io "$dev" screenshot "$2"
            xcrun simctl shutdown "$dev"
          }
          shot "$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | sort -V | tail -1)" ios-iphone.png
          shot "$(xcrun simctl list devices available | grep -oE 'iPad Pro [^(]*' | sed 's/ *$//' | head -1)" ios-ipad.png
          ls -l ios-*.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: apple/ios/ios/App/IsekaiVillage-*-ios.ipa
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: ios-shots
          path: apple/ios/ios/App/ios-*.png
          retention-days: 7
          if-no-files-found: ignore

  attach:
    name: Attach to the release
    if: ${{ inputs.attach }}
    needs: [mac, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: ios
          path: out
      - name: Upload, with their checksums
        working-directory: out
        run: |
          set -euo pipefail
          sha256sum "IsekaiVillage-$TAG-mac.zip" "IsekaiVillage-$TAG-ios.ipa" | tee SHA256-apple.txt
          gh release upload "$TAG" "IsekaiVillage-$TAG-mac.zip" "IsekaiVillage-$TAG-ios.ipa" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Add these lines to the release notes' SHA-256 block:"; cat SHA256-apple.txt
